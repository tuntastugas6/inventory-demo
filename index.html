        function filterSls() {
            const q = document.getElementById('slsSearch').value.toLowerCase().trim();
            const kas = document.getElementById('slsKasus').value;

            State.slsFiltered = State.selisihData.filter(s => {
                let mQ = `${s.ID} ${s.KodeBahan} ${s.NamaBahan} ${s.Petugas}`.toLowerCase().includes(q);
                let mK = kas ? String(s.Kasus).toLowerCase() === kas.toLowerCase() : true;
                return mQ && mK;
            }).sort((a,b) => new Date(b.Tanggal) - new Date(a.Tanggal));
            renderSlsBody();
        }

        function renderSlsBody() {
            const tbody = document.getElementById('slsBody');
            if(State.slsFiltered.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="px-5 py-8 text-center text-slate-400 italic">Tidak ada pencatatan selisih/rusak ditemukan.</td></tr>'; return; }

            tbody.innerHTML = State.slsFiltered.map(s => {
                let clsKasus = String(s.Kasus).toLowerCase() === 'rusak' ? 'bg-orange-100 text-orange-700' : 'bg-red-100 text-red-700';
                
                // Ekstraksi ID Transaksi & Info Peminjam Manual dari kolom Keterangan
                let trxMatch = s.Keterangan ? String(s.Keterangan).match(/\(Trx:\s*(TRX-[A-Z0-9\-]+)\)/i) : null;
                let manualMatch = s.Keterangan ? String(s.Keterangan).match(/\(Peminjam:\s*(.*?)\s*\|\s*Lokasi:\s*(.*?)\)/i) : null;
                
                let valPeminjam = '';
                let valLokasi = '';

                if(trxMatch && trxMatch[1]) {
                    const parentTrx = State.trxBorrow.find(t => t.ID === trxMatch[1]);
                    if(parentTrx) {
                        valPeminjam = parentTrx.Peminjam;
                        valLokasi = parentTrx.Lokasi;
                    } else {
                        valPeminjam = `Trx: ${trxMatch[1]}`;
                        valLokasi = '-';
                    }
                } else if (manualMatch) {
                    valPeminjam = manualMatch[1] || 'Input Manual';
                    valLokasi = manualMatch[2] === '-' ? 'Gudang' : manualMatch[2];
                } else {
                    valPeminjam = s.Petugas || 'Input Manual';
                    valLokasi = '-';
                }

                // Bersihkan tampilan keterangan agar label mapping tidak tampil di tabel
                let showKet = s.Keterangan;
                if(trxMatch) showKet = showKet.replace(trxMatch[0], '').trim();
                if(manualMatch) showKet = showKet.replace(manualMatch[0], '').trim();

                // Ambil referensi dari Master Data secara runtime untuk Merek dan Ukuran (Tanpa mengubah code.gs)
                let mItem = State.masterData.find(x => x.KodeBahan === s.KodeBahan) || {};

                return `
                <tr class="hover:bg-slate-50">
                    <td class="px-5 py-3"><div class="font-bold text-slate-700">${s.Tanggal}</div><div class="text-[10px] font-mono text-slate-500">${s.ID}</div></td>
                    <td class="px-5 py-3">
                        <div class="font-bold text-slate-800">${s.NamaBahan}</div>
                        <div class="text-[10px] text-slate-500 font-mono">${s.KodeBahan} | ${mItem.Merk||'-'} | ${mItem.Ukuran||'-'}</div>
                    </td>
                    <td class="px-5 py-3 font-medium text-slate-700">${valPeminjam}</td>
                    <td class="px-5 py-3 text-xs text-slate-500">${valLokasi}</td>
                    <td class="px-5 py-3 text-center font-bold text-slate-800">${Math.abs(parseFloat(s.Qty))} <span class="text-xs font-normal text-slate-500">${s.Satuan}</span></td>
                    <td class="px-5 py-3 text-center"><span class="px-2 py-1 rounded text-xs font-bold ${clsKasus}">${s.Kasus}</span></td>
                    <td class="px-5 py-3 text-xs italic text-slate-600">${showKet || '-'}</td>
                    <td class="px-5 py-3 text-center admin-only-element no-export">
                        <button onclick="deleteSls('${s.ID}')" class="text-red-500 hover:bg-red-50 p-2 rounded"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        function handleLogoUpload(e) {
            const file = e.target.files[0];
            if(!file) return;
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => {
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/webp', 0.95);
                    
                    document.getElementById('previewAppLogo').src = compressedBase64;
                    document.getElementById('setAppLogoData').value = compressedBase64;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

                app_title: document.getElementById('setAppTitle').value, 
                copyright: document.getElementById('setAppCopy').value, 
                logo_url: logoData, 
                locations: setLoc 
            }).then(d => {
                syncLocalState(d); 
                applySettings(); 
                Swal.fire('Tersimpan','Pengaturan identitas berhasil diperbarui','success');
            }).catch(err => {
                Swal.fire('Error', 'Gagal menyimpan pengaturan. Pastikan koneksi stabil.', 'error');
            });
        }
    </script>
</body>
</html>
