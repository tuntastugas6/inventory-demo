<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventory System</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="https://s6.imgcdn.dev/Y3dmj8.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Library untuk Export PDF & Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .menu-active { background-color: #eff6ff; color: #2563eb; border-right: 4px solid #2563eb; font-weight: 600;}
        
        @media (max-width: 768px) {
            .mobile-nav-active { color: #2563eb; }
            .content-area { padding-bottom: 110px !important; }
        }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #globalLoader { transition: opacity 0.5s ease; }
        .data-fade { transition: opacity 0.3s ease-in-out; }
        .data-fade.updating { opacity: 0.3; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f8fafc; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        #reader { width: 100%; border-radius: 8px; overflow: hidden; border: none !important; }
        #reader video { object-fit: cover; border-radius: 8px; }
        
        /* Dark Mode Overrides */
        html.dark body { background-color: #0f172a; color: #f8fafc; }
        html.dark .bg-white, html.dark .bg-slate-50, html.dark .bg-slate-100 { background-color: #1e293b !important; border-color: #334155 !important; }
        html.dark .text-slate-800, html.dark .text-slate-700 { color: #f8fafc !important; }
        html.dark .text-slate-600, html.dark .text-slate-500 { color: #cbd5e1 !important; }
        html.dark .border-slate-100, html.dark .border-slate-200, html.dark .border-slate-300 { border-color: #334155 !important; }
        html.dark .glass-panel { background: rgba(30, 41, 59, 0.95) !important; }
        html.dark th.bg-slate-50, html.dark th.bg-slate-100 { background-color: #0f172a !important; color: #94a3b8 !important; }
        html.dark tr.hover\:bg-slate-50:hover { background-color: #334155 !important; }
        html.dark .shadow-sm, html.dark .shadow-md, html.dark .shadow-lg, html.dark .shadow-2xl { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5) !important; }
    </style>
</head>
<body class="text-slate-800 antialiased overflow-hidden h-[100dvh] flex relative">

    <!-- GLOBAL DATA LOADER -->
    <div id="globalLoader" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-white">
        <div class="loader mb-4" style="width: 40px; height: 40px; border-width: 4px;"></div>
        <h2 class="text-lg font-bold text-slate-700 animate-pulse">Menghubungkan ke Database...</h2>
        <p class="text-xs text-slate-500 mt-2">Sinkronisasi data real-time</p>
    </div>

    <!-- SCANNER MODAL -->
    <div id="scannerModal" class="hidden fixed inset-0 z-[110] bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-qrcode mr-2 text-blue-600"></i>Scan Barcode</h3>
                <button onclick="closeScanner()" class="text-slate-400 hover:text-red-500 transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-0 bg-black relative"><div id="reader"></div></div>
            <div class="p-4 bg-slate-50 text-center text-xs text-slate-500">Arahkan kamera ke barcode/QR code barang.</div>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-gradient-to-br from-slate-900 to-slate-800">
        <div class="glass-panel p-8 rounded-3xl shadow-2xl w-[90%] max-w-md">
            <div class="text-center mb-8">
                <img id="loginLogo" src="https://s6.imgcdn.dev/Y3dmj8.png" alt="Logo" class="w-24 h-24 mx-auto mb-4 drop-shadow-lg object-contain bg-white rounded-full p-2">
                <h1 class="text-2xl font-bold text-slate-800" id="loginTitle">Inventory System</h1>
                <p class="text-sm text-slate-500 mt-1">Sistem Manajemen Aset & Peminjaman</p>
            </div>
            
            <!-- Login Form -->
            <div id="formLoginBox" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-user text-slate-400"></i></div>
                        <input type="text" id="username" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Masukkan username">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fa-solid fa-lock text-slate-400"></i></div>
                        <input type="password" id="password" class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="••••••••">
                        <button type="button" onclick="togglePassword('password', 'eyeIcon')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"><i class="fa-solid fa-eye" id="eyeIcon"></i></button>
                    </div>
                </div>
                <div class="flex items-center justify-between mt-3 px-1">
                    <label class="flex items-center text-sm font-medium text-slate-600 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 bg-slate-100 border-slate-300 rounded focus:ring-blue-500 mr-2"> Simpan login
                    </label>
                </div>
                <button onclick="handleLogin()" id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex justify-center items-center gap-2">Masuk</button>
                <div class="text-center mt-4">
                    <button onclick="toggleAuthForm('register')" class="text-sm font-medium text-blue-600 hover:underline">Belum punya akun? Daftar Peminjam</button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="formRegisterBox" class="hidden space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-slate-700 mb-1">Nama Lengkap</label>
                        <input type="text" id="regNama" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Sesuai ID">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">No. Pekerja (NoPek)</label>
                        <input type="text" id="regNoPek" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="123456">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-700 mb-1">No. WhatsApp</label>
                        <input type="tel" id="regNoHP" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="08xxxxxxxx">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-medium text-slate-700 mb-1">Username Login Baru</label>
                        <input type="text" id="regUsername" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Buat username unik">
                    </div>
                    <div class="col-span-2 relative">
                        <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                        <input type="password" id="regPassword" class="w-full pl-3 pr-10 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Minimal 6 karakter">
                        <button type="button" onclick="togglePassword('regPassword', 'regEyeIcon')" class="absolute bottom-2 right-3 text-slate-400"><i class="fa-solid fa-eye" id="regEyeIcon"></i></button>
                    </div>
                </div>
                <button onclick="handleRegister()" id="btnRegister" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl shadow-lg mt-2 transition-all">Daftar Akun</button>
                <div class="text-center mt-2">
                    <button onclick="toggleAuthForm('login')" class="text-sm font-medium text-slate-500 hover:text-slate-800 transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Login</button>
                </div>
            </div>
            
            <div class="mt-8 text-center text-xs text-slate-400" id="loginCopyright">&copy; 2026 Inventory System</div>
        </div>
    </div>

    <!-- MAIN APP LAYOUT -->
    <div id="mainApp" class="hidden w-full h-full flex flex-col md:flex-row transition-opacity duration-300">
        <!-- SIDEBAR (Desktop) -->
        <aside class="hidden md:flex flex-col w-64 bg-white border-r border-slate-200 h-full shadow-sm z-20">
            <div class="h-16 flex items-center px-6 border-b border-slate-100 shrink-0">
                <img id="appLogo" src="https://s6.imgcdn.dev/Y3dmj8.png" alt="Logo" class="h-8 w-8 object-contain mr-3">
                <span id="appTitle" class="font-bold text-lg text-slate-800 truncate">Inventaris</span>
            </div>
            <div class="flex-1 overflow-y-auto hide-scroll py-4">
                <nav class="space-y-1 px-3" id="desktopNav"></nav>
            </div>
            <div class="p-4 border-t border-slate-100 shrink-0 bg-slate-50/50">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold shadow-inner">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-semibold text-slate-800 truncate" id="sideUserName">User</p>
                        <p class="text-[10px] font-bold tracking-wider text-slate-500 uppercase truncate" id="sideUserRole">Role</p>
                    </div>
                </div>
                <button onclick="logout()" class="w-full text-left px-4 py-2.5 text-sm font-bold text-red-600 bg-red-50 hover:bg-red-100 rounded-lg transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-power-off"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 flex flex-col h-full bg-slate-50 relative overflow-hidden">
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 lg:px-8 shrink-0 shadow-sm z-10">
                <div class="flex items-center gap-3">
                    <div class="md:hidden flex items-center gap-2">
                        <img id="mobileAppLogo" src="https://s6.imgcdn.dev/Y3dmj8.png" alt="Logo" class="h-8 w-8 object-contain">
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-800" id="greetingText">Selamat Pagi</h2>
                        <p class="text-xs text-slate-500" id="headerDateInfo">Sistem Inventaris Aktif</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="toggleDarkMode()" id="btnDarkMode" class="text-slate-400 hover:text-blue-500 transition-colors w-9 h-9 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800">
                        <i class="fa-solid fa-moon text-lg"></i>
                    </button>
                    <div class="relative md:hidden">
                        <button onclick="logout()" class="text-slate-400 hover:text-red-500 p-2 bg-slate-100 rounded-full w-9 h-9 flex items-center justify-center">
                            <i class="fa-solid fa-power-off"></i>
                        </button>
                    </div>
                    <div class="hidden md:flex items-center bg-blue-50 text-blue-700 font-medium rounded-full px-4 py-1.5 border border-blue-100 shadow-sm">
                        <i class="fa-regular fa-clock mr-2"></i>
                        <span id="realtimeClock" class="text-sm tracking-wide">00:00:00</span>
                    </div>
                </div>
            </header>
            <div id="viewsContainer" class="flex-1 overflow-y-auto content-area p-4 lg:p-8 hide-scroll scroll-smooth relative"></div>
        </main>

        <!-- BOTTOM NAV (Mobile Only) Horizontal Scrollable -->
        <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t border-slate-200 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-40 pb-safe">
            <div class="flex justify-start items-center h-16 overflow-x-auto hide-scroll px-2 gap-2" id="mobileNav"></div>
        </nav>
    </div>

    <!-- 1. DASHBOARD TEMPLATE -->
    <template id="tpl-dashboard">
        <div class="space-y-6 animate-fade-in pb-10 md:pb-4">
            
            <!-- Quick Access Section -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4 mb-4">
                <button onclick="navigate('borrow')" class="quick-access-btn bg-white border border-slate-200 rounded-xl p-3 flex items-center gap-3 shadow-sm hover:border-blue-300 group">
                    <div class="w-10 h-10 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-colors"><i class="fa-solid fa-plus"></i></div>
                    <div class="text-left"><p class="text-sm font-bold text-slate-800">Pinjam Baru</p><p class="text-[10px] text-slate-500">Form Peminjaman</p></div>
                </button>
                <button onclick="navigate('return')" class="quick-access-btn bg-white border border-slate-200 rounded-xl p-3 flex items-center gap-3 shadow-sm hover:border-emerald-300 group">
                    <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center group-hover:bg-emerald-600 group-hover:text-white transition-colors"><i class="fa-solid fa-arrow-right-arrow-left"></i></div>
                    <div class="text-left"><p class="text-sm font-bold text-slate-800">Pengembalian</p><p class="text-[10px] text-slate-500">Proses Kembali</p></div>
                </button>
                <button onclick="if(State.user.role==='Admin') navigate('selisih'); else Swal.fire('Akses Ditolak','Khusus Admin','warning');" class="quick-access-btn bg-white border border-slate-200 rounded-xl p-3 flex items-center gap-3 shadow-sm hover:border-red-300 group">
                    <div class="w-10 h-10 rounded-lg bg-red-50 text-red-600 flex items-center justify-center group-hover:bg-red-600 group-hover:text-white transition-colors"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <div class="text-left"><p class="text-sm font-bold text-slate-800">Lapor Rusak</p><p class="text-[10px] text-slate-500">Input Selisih</p></div>
                </button>
                <button onclick="navigate('database');" class="quick-access-btn bg-white border border-slate-200 rounded-xl p-3 flex items-center gap-3 shadow-sm hover:border-indigo-300 group">
                    <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors"><i class="fa-solid fa-boxes-stacked"></i></div>
                    <div class="text-left"><p class="text-sm font-bold text-slate-800">Cek Database</p><p class="text-[10px] text-slate-500">Rekap Stok</p></div>
                </button>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 data-fade" id="dashSummaryCards">
                <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 opacity-20 text-8xl"><i class="fa-solid fa-boxes-stacked"></i></div>
                    <p class="text-blue-100 text-sm font-medium mb-1 tracking-wide">Total Inventaris Murni</p>
                    <h3 class="text-4xl font-bold mb-1" id="dashTotalAwal">0</h3>
                    <p class="text-xs font-medium bg-white/20 inline-block px-2 py-1 rounded">Berdasarkan Stok Awal</p>
                </div>
                <div class="bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
                    <div class="absolute -right-4 -bottom-4 opacity-20 text-8xl"><i class="fa-solid fa-check-circle"></i></div>
                    <p class="text-emerald-100 text-sm font-medium mb-1 tracking-wide">Tersedia (Ready)</p>
                    <h3 class="text-4xl font-bold mb-1" id="dashTersedia">0</h3>
                    <p class="text-xs font-medium bg-white/20 inline-block px-2 py-1 rounded">Siap dipinjam/digunakan</p>
                </div>
                <div class="bg-gradient-to-br from-amber-500 to-orange-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden cursor-pointer hover:ring-4 ring-orange-300 transition-all" onclick="navigate('riwayat_peminjaman')">
                    <div class="absolute -right-4 -bottom-4 opacity-20 text-8xl"><i class="fa-solid fa-hand-holding-hand"></i></div>
                    <p class="text-amber-100 text-sm font-medium mb-1 tracking-wide">Sedang Dipinjam</p>
                    <div class="flex items-end gap-3">
                        <h3 class="text-4xl font-bold mb-0" id="dashDipinjam">0</h3>
                        <div class="bg-white/20 px-2 py-1 rounded text-xs font-bold mb-1 flex items-center"><i class="fa-solid fa-clock mr-1"></i> <span id="dashTerlambat">0</span> Terlambat</div>
                    </div>
                </div>
                <div class="bg-gradient-to-br from-rose-500 to-red-600 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden cursor-pointer hover:ring-4 ring-red-300 transition-all" onclick="if(State.user.role==='Admin') navigate('selisih')">
                    <div class="absolute -right-4 -bottom-4 opacity-20 text-8xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <p class="text-rose-100 text-sm font-medium mb-1 tracking-wide">Barang Rusak/Hilang</p>
                    <div class="flex gap-4">
                        <div><h3 class="text-2xl font-bold mb-0" id="dashRusak">0</h3><p class="text-[10px] uppercase tracking-wider text-rose-200">Rusak</p></div>
                        <div class="w-px bg-white/30 my-1"></div>
                        <div><h3 class="text-2xl font-bold mb-0" id="dashHilang">0</h3><p class="text-[10px] uppercase tracking-wider text-rose-200">Hilang</p></div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                        <h3 class="font-bold text-slate-800"><i class="fa-solid fa-chart-line text-blue-500 mr-2"></i>Aktivitas Peminjaman (7 Hari)</h3>
                        <button onclick="refreshGlobalData(this)" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-2 py-1 rounded transition"><i class="fa-solid fa-rotate"></i> Sync</button>
                    </div>
                    <div class="relative h-64 w-full data-fade" id="wrapChartHistory"><canvas id="mainChart"></canvas></div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                    <h3 class="font-bold text-slate-800 mb-4 border-b border-slate-100 pb-3"><i class="fa-solid fa-chart-pie text-indigo-500 mr-2"></i>Komposisi Kategori</h3>
                    <div class="relative h-48 w-full flex justify-center data-fade" id="wrapChartPie"><canvas id="pieChart"></canvas></div>
                    <div class="mt-4 flex justify-center flex-wrap gap-2 text-xs font-medium text-slate-600" id="pieChartLegend"></div>
                </div>
            </div>
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden data-fade mb-20 md:mb-0">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h3 class="font-bold text-slate-800"><i class="fa-solid fa-bolt text-amber-500 mr-2"></i>Peminjaman Terbaru</h3>
                    <button onclick="navigate('riwayat_peminjaman')" class="text-xs bg-white border border-slate-300 text-slate-600 font-bold px-3 py-1.5 rounded-lg hover:bg-slate-100 transition">Lihat Semua</button>
                </div>
                <div class="overflow-x-auto custom-scrollbar border-t border-slate-100">
                    <table class="w-full text-left text-sm whitespace-nowrap min-w-[600px]">
                        <thead class="bg-white text-slate-500 border-b border-slate-100 text-xs uppercase tracking-wider">
                            <tr><th class="px-5 py-3">ID Peminjaman</th><th class="px-5 py-3">Peminjam</th><th class="px-5 py-3">Lokasi</th><th class="px-5 py-3">Tanggal Pinjam</th><th class="px-5 py-3 text-center">Status</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50" id="recentTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>

    <!-- 2. FORM PEMINJAMAN (BORROW) -->
    <template id="tpl-borrow">
        <div class="max-w-4xl mx-auto space-y-6 animate-fade-in pb-10 md:pb-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8 relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
                
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-100 pb-5 mb-5 gap-4">
                    <div>

                        <button onclick="saveNewLokasi()" class="w-full sm:w-auto shrink-0 bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700 transition-colors flex items-center justify-center gap-2">Tambah Lokasi</button>
                    </div>
                    <div class="border border-slate-200 rounded-xl overflow-x-auto mt-4 sm:w-2/3 custom-scrollbar">
                        <table class="w-full text-left text-sm whitespace-nowrap"><thead class="bg-slate-100 border-b border-slate-200 text-xs uppercase text-slate-600"><tr><th class="px-5 py-3">Unit / Lokasi</th><th class="px-5 py-3 w-24 text-center">Aksi</th></tr></thead><tbody id="tblLokasiList" class="divide-y divide-slate-100"></tbody></table>
                    </div>
                </div>

                <!-- App Tab -->
                <div id="setTab-app" class="hidden space-y-5">
                    <h3 class="text-lg font-bold text-slate-700 border-b pb-2">Pengaturan Identitas</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 max-w-2xl">
                        <div><label class="block text-sm font-bold text-slate-600 mb-1">Judul Aplikasi</label><input type="text" id="setAppTitle" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50"></div>
                        <div><label class="block text-sm font-bold text-slate-600 mb-1">Copyright Footer</label><input type="text" id="setAppCopy" class="w-full border border-slate-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50"></div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold text-slate-600 mb-1">Upload Logo Aplikasi</label>
                            <div class="flex items-center gap-4">
                                <div class="w-16 h-16 rounded-xl border-2 border-dashed border-slate-300 flex justify-center items-center overflow-hidden bg-slate-50 shrink-0">
                                    <img id="previewAppLogo" src="" alt="Preview" class="w-full h-full object-contain">
                                </div>
                                <div class="flex-1">
                                    <input type="file" id="setAppLogoFile" accept="image/png, image/jpeg, image/svg+xml" onchange="handleLogoUpload(event)" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                                    <input type="hidden" id="setAppLogoData">
                                    <p class="text-[10px] text-slate-500 mt-1">Format: PNG, JPG, SVG. Gambar otomatis di-resize & kompres agar super ringan.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button onclick="saveAppSet()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-blue-700 transition w-full md:w-auto flex items-center justify-center gap-2"><i class="fa-solid fa-save"></i> Simpan Perubahan</button>
                </div>
            </div>
        </div>
    </template>

    <script>
        const State = {
            user: null, settings: {}, categories: [], locations: [], users: [], 
            masterData: [], trxBorrow: [], logReturn: [], selisihData: [],
            currentView: 'dashboard',
            
            borrowCart: [],
            
            tableData: [], filteredData: [], currentPage: 1, 
            trxFiltered: [], trxPage: 1,
            slsFiltered: [], slsPage: 1,

            metrics: { awal: 0, tersedia: 0, dipinjam: 0, rusak: 0, hilang: 0, terlambat: 0, catMap: {} }
        };

        const API_URL = "https://script.google.com/macros/s/AKfycbwKrMBUf2h6XobGNTjvHg4XeZENu8zsxRrcKAlrdPF5p8eeBNiUVFzuODg7WNkj8ODx/exec";

        const runGas = async (func, ...args) => {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST', body: JSON.stringify({ action: func, args: args }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const json = await res.json();
                if (json.success) return json.data;
                else throw new Error(json.error || "Server error.");
            } catch (err) {
                console.error("API Error:", err);
                throw err;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('hh_dark') === '1') {
                document.documentElement.classList.add('dark');
            }
            updateClock(); setInterval(updateClock, 1000);
            const dateStr = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('headerDateInfo').textContent = dateStr;

            runGas('getAppData').then(data => {
                syncLocalState(data);
                
                const savedUser = localStorage.getItem('hh_user');
                const savedPass = localStorage.getItem('hh_pass');
                if (savedUser && savedPass) {
                    document.getElementById('username').value = savedUser;
                    document.getElementById('password').value = savedPass;
                    document.getElementById('rememberMe').checked = true;
                }
                
                document.getElementById('globalLoader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('globalLoader').classList.add('hidden');
                    document.getElementById('loginScreen').classList.remove('hidden');
                    applySettings();
                    
                    const icon = document.querySelector('#btnDarkMode i');
                    if(document.documentElement.classList.contains('dark') && icon) {
                        icon.classList.replace('fa-moon', 'fa-sun');
                    }
                }, 500);
            }).catch(e => { 
                document.getElementById('globalLoader').innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-xl shadow-lg border border-red-200 text-center"><i class="fa-solid fa-triangle-exclamation text-4xl mb-3"></i><p class="font-bold">Gagal terhubung dengan server.</p><p class="text-xs mt-1">Pastikan API URL benar dan koneksi internet stabil.</p></div>`; 
            });
        });

        document.addEventListener('click', (e) => {
            if(!e.target.closest('#wrapBorrowDropdown') && !e.target.closest('#scannerModal')) { 
                const dd1 = document.getElementById('listDrop_borrow'); 
                if(dd1) dd1.classList.add('hidden'); 
            }
            if(!e.target.closest('#wrapSelisihDropdown')) { 
                const dd2 = document.getElementById('listDrop_selisih'); 
                if(dd2) dd2.classList.add('hidden'); 
            }
        });

        // ==========================================
        // EXPORT FUNCTIONS (EXCEL & PDF) 
        // ==========================================
        function getExportDataMap(type) {
            let dataToExport = [];
            let headers = [];

            if (type === 'database') {
                headers = ['ID Barang', 'Nama Barang', 'Kategori', 'Merek', 'Ukuran', 'Stok Awal', 'Tersedia', 'Dipinjam', 'Rusak/Hilang'];
                dataToExport = State.filteredData.map(m => [
                    m.KodeBahan, m.NamaBahan, m.Kategori, m.Merk||'-', m.Ukuran||'-', 
                    m.StokAwal, m.currentTersedia, m.currentDipinjam, m.currentKeluar
                ]);
            } else if (type === 'riwayat') {
                headers = ['ID Transaksi', 'Tanggal', 'Tenggat', 'Peminjam', 'NoPek', 'Lokasi', 'Status', 'Rincian Barang'];
                dataToExport = State.trxFiltered.map(t => {
                    let itemsText = t.ItemsJSON.map(i => `${i.nama} [Merk:${i.merk||'-'} | Ukr:${i.ukuran||'-'}] (${i.qtyPinjam} pjm, ${i.qtyKembali} kbl, ${i.qtyRusak} rsk)`).join('; ');
                    return [t.ID, t.Tanggal.substring(0,16), t.Tenggat, t.Peminjam, t.NoPek, t.Lokasi, t.Status, itemsText];
                });
            } else if (type === 'selisih') {
                // Menambahkan Kolom Merek & Ukuran di file export
                headers = ['ID Laporan', 'Tanggal', 'Kode Barang', 'Nama Barang', 'Merek', 'Ukuran', 'Peminjam', 'Lokasi', 'Qty', 'Kasus', 'Keterangan'];
                dataToExport = State.slsFiltered.map(s => {
                    let trxMatch = s.Keterangan ? String(s.Keterangan).match(/\(Trx:\s*(TRX-[A-Z0-9\-]+)\)/i) : null;
                    let manualMatch = s.Keterangan ? String(s.Keterangan).match(/\(Peminjam:\s*(.*?)\s*\|\s*Lokasi:\s*(.*?)\)/i) : null;
                    
                    let valPeminjam = ''; let valLokasi = ''; let cleanKet = s.Keterangan;
                    if(trxMatch && trxMatch[1]) {
                        const pTrx = State.trxBorrow.find(t => t.ID === trxMatch[1]);
                        if(pTrx) { valPeminjam = pTrx.Peminjam; valLokasi = pTrx.Lokasi; }
                        else { valPeminjam = `Trx: ${trxMatch[1]}`; valLokasi = '-'; }
                        cleanKet = cleanKet.replace(trxMatch[0], '').trim();
                    } else if (manualMatch) {
                        valPeminjam = manualMatch[1] || 'Input Manual';
                        valLokasi = manualMatch[2] === '-' ? 'Gudang' : manualMatch[2];
                        cleanKet = cleanKet.replace(manualMatch[0], '').trim();
                    } else {
                        valPeminjam = s.Petugas || 'Input Manual'; valLokasi = '-';
                    }

                    // Ambil detail Merek & Ukuran dari MasterData
                    let mItem = State.masterData.find(x => x.KodeBahan === s.KodeBahan) || {};

                    return [s.ID, s.Tanggal, s.KodeBahan, s.NamaBahan, mItem.Merk || '-', mItem.Ukuran || '-', valPeminjam, valLokasi, Math.abs(parseFloat(s.Qty)), s.Kasus, cleanKet];
                });
            }
            return { headers, dataToExport };
        }

        function exportDataToExcel(type, filename) {
            const { headers, dataToExport } = getExportDataMap(type);
            if(dataToExport.length === 0) return Swal.fire('Info', 'Tidak ada data untuk diekspor.', 'info');

            const ws_data = [headers, ...dataToExport];
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            const today = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `${filename}_${today}.xlsx`);
        }

        function exportDataToPDF(type, filename) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('landscape');
            
            doc.setFontSize(14);
            doc.text(`Laporan: ${filename.replace(/_/g, ' ')}`, 14, 15);
            doc.setFontSize(10);
            doc.text(`Dicetak pada: ${new Date().toLocaleString('id-ID')}`, 14, 22);

            const { headers, dataToExport } = getExportDataMap(type);
            if(dataToExport.length === 0) return Swal.fire('Info', 'Tidak ada data untuk diekspor.', 'info');

            doc.autoTable({
                head: [headers],
                body: dataToExport,
                startY: 28,
                theme: 'grid',
                styles: { fontSize: 8, cellPadding: 2 },
                headStyles: { fillColor: [37, 99, 235] } 
            });

            const today = new Date().toISOString().split('T')[0];
            doc.save(`${filename}_${today}.pdf`);
        }
        // ==========================================

        function syncLocalState(data) {
            if (!data || typeof data !== 'object') return; 
            State.settings = data.settings || State.settings || {}; 
            State.users = data.users || State.users || [];
            State.categories = data.categories || State.categories || ['Umum'];
            try { State.locations = State.settings.locations ? JSON.parse(State.settings.locations) : ['Area Kilang', 'Perkantoran', 'Gudang']; } catch(e) { State.locations = ['Umum']; }
            State.masterData = data.master || State.masterData || []; 
            
            State.trxBorrow = (data.borrow || []).map(r => {
                try { r.ItemsJSON = typeof r.ItemsJSON === 'string' ? JSON.parse(r.ItemsJSON) : (r.ItemsJSON || []); } 
                catch(e){ r.ItemsJSON = []; }
                return r;
            });
            
            State.logReturn = data.return || [];
            State.selisihData = data.selisih || [];

            calculateMetrics();
        }

        function calculateMetrics() {
            let mAwal=0, mTersedia=0, mDipinjam=0, mRusak=0, mHilang=0, mTerlambat=0;
            let cMap = {}; State.categories.forEach(c => cMap[c] = {awal:0, tersedia:0});

            const now = new Date();
            now.setHours(0,0,0,0);

            let usageMap = {}; 
            
            State.trxBorrow.forEach(trx => {
                let isLate = trx.Status !== 'Selesai' && new Date(trx.Tenggat) < now;
                if(isLate) mTerlambat++;

                trx.ItemsJSON.forEach(item => {
                    if(!usageMap[item.kode]) usageMap[item.kode] = { pinjam:0, kbl:0, rusakHlg:0 };
                    usageMap[item.kode].pinjam += parseFloat(item.qtyPinjam)||0;
                    usageMap[item.kode].kbl += parseFloat(item.qtyKembali)||0;
                    usageMap[item.kode].rusakHlg += parseFloat(item.qtyRusak)||0;
                });
            });

            State.selisihData.forEach(sls => {
                let q = Math.abs(parseFloat(sls.Qty)||0);
                if(String(sls.Kasus).toLowerCase() === 'rusak') mRusak += q;
                else mHilang += q;
            });

            State.masterData.forEach(m => {
                let awal = parseFloat(m.StokAwal)||0;
                let usage = usageMap[m.KodeBahan] || {pinjam:0, kbl:0, rusakHlg:0};
                let activeBorrow = usage.pinjam - usage.kbl - usage.rusakHlg;
                if(activeBorrow < 0) activeBorrow = 0; 
                
                let totalSls = State.selisihData.filter(s=>s.KodeBahan===m.KodeBahan).reduce((acc,curr)=>acc+Math.abs(parseFloat(curr.Qty)),0);
                let sedia = awal - activeBorrow - totalSls;

                mAwal += awal;
                mTersedia += sedia;
                mDipinjam += activeBorrow;

                if(!cMap[m.Kategori]) cMap[m.Kategori] = {awal:0, tersedia:0};
                cMap[m.Kategori].awal += awal;
                cMap[m.Kategori].tersedia += sedia;

                m.currentTersedia = sedia;
                m.currentDipinjam = activeBorrow;
                m.currentKeluar = totalSls; 
            });

            State.metrics = { awal: mAwal, tersedia: mTersedia, dipinjam: mDipinjam, rusak: mRusak, hilang: mHilang, terlambat: mTerlambat, catMap: cMap };
        }

        function applySettings() {
            const title = State.settings.app_title || 'Inventory System';
            document.getElementById('loginTitle').textContent = title;
            document.title = title;
            
            const logoUrl = State.settings.logo_url || 'https://s6.imgcdn.dev/Y3dmj8.png';
            document.getElementById('loginLogo').src = logoUrl;
            document.getElementById('appLogo').src = logoUrl;
            document.getElementById('mobileAppLogo').src = logoUrl;
            if (document.getElementById('dynamicFavicon')) document.getElementById('dynamicFavicon').href = logoUrl;
            
            document.getElementById('loginCopyright').innerHTML = State.settings.copyright || '&copy; 2026';
            document.getElementById('appTitle').textContent = title.split(' ')[0]; // short version
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('hh_dark', isDark ? '1' : '0');
            const icon = document.querySelector('#btnDarkMode i');
            if(isDark) { icon.classList.replace('fa-moon', 'fa-sun'); } 
            else { icon.classList.replace('fa-sun', 'fa-moon'); }
        }

        function toggleAuthForm(target) {
            const lForm = document.getElementById('formLoginBox');
            const rForm = document.getElementById('formRegisterBox');
            if (target === 'register') {
                lForm.classList.add('hidden'); rForm.classList.remove('hidden');
            } else {
                rForm.classList.add('hidden'); lForm.classList.remove('hidden');
            }
        }

        function togglePassword(inputId, iconId) {
            const i = document.getElementById(inputId); const ic = document.getElementById(iconId);
            if (i.type === 'password') { i.type = 'text'; ic.classList.replace('fa-eye', 'fa-eye-slash'); } 
            else { i.type = 'password'; ic.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        function handleLogin() {
            const u = document.getElementById('username').value.trim(); const p = document.getElementById('password').value;
            const isRemembered = document.getElementById('rememberMe').checked;
            if(!u || !p) return Swal.fire('Peringatan', 'Username dan Password wajib diisi!', 'warning');
            
            const btn = document.getElementById('btnLogin'); btn.innerHTML = `<div class="loader mx-auto" style="width:20px;height:20px;border-width:2px;"></div>`; btn.disabled = true;

            runGas('loginUser', u, p).then(res => {
                btn.innerHTML = `Masuk`; btn.disabled = false;
                if(res.success) {
                    if(isRemembered) { localStorage.setItem('hh_user', u); localStorage.setItem('hh_pass', p); } 
                    else { localStorage.removeItem('hh_user'); localStorage.removeItem('hh_pass'); }

                    State.user = res.user;
                    document.getElementById('sideUserName').textContent = res.user.name;
                    document.getElementById('sideUserRole').textContent = res.user.role;
                    
                    document.getElementById('loginScreen').style.opacity = '0';
                    setTimeout(() => { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); navigate('dashboard'); }, 300);
                    Swal.fire({ icon: 'success', title: `Selamat Datang, ${res.user.name.split(' ')[0]}`, toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
                } else Swal.fire('Gagal', 'Username atau Password salah!', 'error');
            }).catch(e => { btn.innerHTML = `Masuk`; btn.disabled = false; Swal.fire('Error', 'Gagal terhubung dengan server!', 'error');});
        }

        function handleRegister() {
            const payload = {
                id: 'U' + Date.now(),
                name: document.getElementById('regNama').value.trim(),
                noPek: document.getElementById('regNoPek').value.trim(),
                noHP: document.getElementById('regNoHP').value.trim(),
                username: document.getElementById('regUsername').value.trim(),
                pass: document.getElementById('regPassword').value,
                role: 'Peminjam'
            };

            if(!payload.name || !payload.noPek || !payload.username || !payload.pass) return Swal.fire('Peringatan', 'Nama, NoPek, Username dan Password wajib diisi!', 'warning');
            if(State.users.find(u => u.Username.toLowerCase() === payload.username.toLowerCase())) return Swal.fire('Gagal', 'Username sudah terdaftar, buat yang lain.', 'error');

            const btn = document.getElementById('btnRegister'); btn.innerHTML = `<div class="loader mx-auto" style="width:20px;height:20px;border-width:2px;border-top-color:white;"></div>`; btn.disabled = true;

            runGas('registerUser', payload).then(d => {
                if(d) syncLocalState(d);
                btn.innerHTML = `Daftar Akun`; btn.disabled = false;
                Swal.fire('Berhasil', 'Akun Peminjam berhasil dibuat! Silakan Login.', 'success').then(() => {
                    document.getElementById('username').value = payload.username;
                    document.getElementById('password').value = payload.pass;
                    toggleAuthForm('login');
                });
            }).catch(e => { btn.innerHTML = `Daftar Akun`; btn.disabled = false; Swal.fire('Error', 'Gagal mendaftar akun.', 'error'); });
        }

        function logout() {
            Swal.fire({ title: 'Keluar aplikasi?', icon: 'question', showCancelButton: true, confirmButtonColor: '#e11d48', confirmButtonText: 'Keluar' }).then(r => {
                if(r.isConfirmed) {
                    document.getElementById('mainApp').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('mainApp').classList.add('hidden');
                        document.getElementById('loginScreen').classList.remove('hidden');
                        document.getElementById('loginScreen').style.opacity = '0';
                        State.user = null; 
                        if(!document.getElementById('rememberMe').checked) { document.getElementById('username').value = ''; document.getElementById('password').value = ''; }
                        setTimeout(() => { document.getElementById('loginScreen').style.opacity = '1'; document.getElementById('mainApp').style.opacity = '1'; }, 50);
                    }, 300);
                }
            });
        }

        function updateClock() {
            const now = new Date(); document.getElementById('realtimeClock').textContent = now.toLocaleTimeString('id-ID');
            let greeting = 'Selamat Pagi'; const h = now.getHours();
            if(h >= 11 && h < 15) greeting = 'Selamat Siang'; else if(h >= 15 && h < 18) greeting = 'Selamat Sore'; else if(h >= 18) greeting = 'Selamat Malam';
            if(State.user) document.getElementById('greetingText').textContent = `${greeting}, ${State.user.name.split(' ')[0]}`;
        }

        const Menus = [
            { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard', roles: ['Admin', 'Peminjam'] },
            { id: 'borrow', icon: 'fa-cart-flatbed', label: 'Form Peminjaman', roles: ['Admin', 'Peminjam'] },
            { id: 'return', icon: 'fa-rotate-left', label: 'Form Pengembalian', roles: ['Admin', 'Peminjam'] },
            { id: 'riwayat_peminjaman', icon: 'fa-clipboard-list', label: 'Riwayat Peminjaman', roles: ['Admin', 'Peminjam'] },
            // Menu Database kini terbuka untuk Peminjam dengan fungsi view-only (di-handle di fungsi render tabel)
            { id: 'database', icon: 'fa-database', label: 'Rekap Stok Aset', roles: ['Admin', 'Peminjam'] }, 
            { id: 'selisih', icon: 'fa-triangle-exclamation', label: 'Selisih (Rusak/Hilang)', roles: ['Admin'] },
            { id: 'settings', icon: 'fa-gear', label: 'Master Data & Setting', roles: ['Admin'] }
        ];

        function renderNavigation() {
            const dNav = document.getElementById('desktopNav'); const mNav = document.getElementById('mobileNav');
            dNav.innerHTML = ''; mNav.innerHTML = '';
            Menus.filter(m => m.roles.includes(State.user.role)).forEach(menu => {
                const isActive = State.currentView === menu.id;
                dNav.innerHTML += `<button onclick="navigate('${menu.id}')" class="w-full text-left px-4 py-3 rounded-xl mb-1.5 text-sm font-bold transition-all flex items-center gap-3 ${isActive ? 'menu-active shadow-sm' : 'text-slate-500 hover:bg-slate-100'}"><i class="fa-solid ${menu.icon} w-5 text-center text-lg"></i> <span>${menu.label}</span></button>`;
                mNav.innerHTML += `<button onclick="navigate('${menu.id}')" class="flex-none flex flex-col items-center justify-center w-[72px] h-full gap-1 transition-colors ${isActive ? 'mobile-nav-active font-bold' : 'text-slate-400'}"><i class="fa-solid ${menu.icon} text-[20px] mb-0.5"></i> <span class="text-[9px] w-full text-center leading-tight overflow-hidden text-ellipsis px-1" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${menu.label}</span></button>`;
            });

            if(State.user.role !== 'Admin') {
                document.querySelectorAll('.admin-only-element').forEach(el => el.classList.add('hidden'));
            } else {
                document.querySelectorAll('.admin-only-element').forEach(el => el.classList.remove('hidden'));
            }
        }

        function navigate(viewId) {
            State.currentView = viewId; renderNavigation();
            const container = document.getElementById('viewsContainer'); container.innerHTML = '';
            closeScanner();
            
            if (viewId === 'dashboard') loadDashboard(container);
            else if (viewId === 'borrow') loadBorrow(container);
            else if (viewId === 'return') loadReturn(container);
            else if (viewId === 'database') loadDatabase(container);
            else if (viewId === 'riwayat_peminjaman') loadRiwayatTrx(container);
            else if (viewId === 'selisih') loadSelisih(container);
            else if (viewId === 'settings') loadSettings(container);
        }

        function refreshGlobalData(btn) {
            let originalHtml = '';
            if (btn) { originalHtml = btn.innerHTML; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Sync...`; btn.disabled = true; } 
            else Swal.fire({title: 'Sinkronisasi...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});

            runGas('getAppData').then(data => {
                syncLocalState(data); 
                navigate(State.currentView);
                if (btn) { btn.innerHTML = originalHtml; btn.disabled = false; } else Swal.close();
                Swal.fire({icon: 'success', title: 'Data Tersinkronisasi', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500});
            }).catch(e => {
                if (btn) { btn.innerHTML = originalHtml; btn.disabled = false; } else Swal.close();
                Swal.fire('Error', 'Gagal memuat ulang data', 'error');
            });
        }

        function loadDashboard(container) {
            container.appendChild(document.getElementById('tpl-dashboard').content.cloneNode(true));
            calculateMetrics();

            document.getElementById('dashTersedia').textContent = State.metrics.tersedia;
            document.getElementById('dashDipinjam').textContent = State.metrics.dipinjam;
            document.getElementById('dashTerlambat').textContent = State.metrics.terlambat;
            document.getElementById('dashRusak').textContent = State.metrics.rusak;
            document.getElementById('dashHilang').textContent = State.metrics.hilang;

            const tbody = document.getElementById('recentTableBody');
            const recent = [...State.trxBorrow].sort((a,b) => new Date(b.Tanggal) - new Date(a.Tanggal)).slice(0, 5);
            
            if(recent.length === 0) tbody.innerHTML = `<tr><td colspan="5" class="px-5 py-6 text-center text-slate-400 italic">Belum ada aktivitas peminjaman.</td></tr>`;
            else {
                tbody.innerHTML = recent.map(r => {
                    let st = r.Status;
                    let stClass = st==='Selesai'?'bg-emerald-100 text-emerald-700':(st==='Sebagian'?'bg-amber-100 text-amber-700':'bg-blue-100 text-blue-700');
                    return `<tr class="hover:bg-slate-50"><td class="px-5 py-3 font-mono font-bold text-xs">${r.ID}</td><td class="px-5 py-3 font-medium text-slate-800">${r.Peminjam}</td><td class="px-5 py-3 text-xs">${r.Lokasi}</td><td class="px-5 py-3 text-xs">${r.Tanggal}</td><td class="px-5 py-3 text-center"><span class="px-2 py-1 rounded text-[10px] font-bold ${stClass}">${st}</span></td></tr>`;
                }).join('');
            }

            const ctxM = document.getElementById('mainChart').getContext('2d');
            const ctxP = document.getElementById('pieChart').getContext('2d');
            
            let dateLabels = []; let pinjamData = []; let lunasData = [];
            const today = new Date();
            for(let i = 6; i >= 0; i--) {
                const d = new Date(today); d.setDate(today.getDate() - i);
                let iso = d.toISOString().split('T')[0];
                let display = `${d.getDate()}/${d.getMonth()+1}`;
                dateLabels.push({iso, display});
                pinjamData.push(0); lunasData.push(0);
            }

            State.trxBorrow.forEach(trx => {
                let dIso = trx.Tanggal.split(' ')[0];
                let idx = dateLabels.findIndex(dl => dl.iso === dIso);
                if(idx > -1) {
                    let sumP = trx.ItemsJSON.reduce((sum, item)=>sum+(parseFloat(item.qtyPinjam)||0),0);
                    let sumK = trx.ItemsJSON.reduce((sum, item)=>sum+(parseFloat(item.qtyKembali)||0),0);
                    pinjamData[idx] += sumP;
                    lunasData[idx] += sumK;
                }
            });

            new Chart(ctxM, { 
                type: 'bar', 
                data: { labels: dateLabels.map(x=>x.display), datasets: [
                    {label: 'Item Dipinjam', data:pinjamData, backgroundColor:'#3b82f6', borderRadius:4},
                    {label: 'Item Dikembalikan', data:lunasData, backgroundColor:'#10b981', borderRadius:4}
                ]}, 
                options: {responsive:true, maintainAspectRatio:false, scales: {y: {beginAtZero: true, grid:{borderDash:[2,4]}}, x:{grid:{display:false}}}}
            });

            let pLabels = Object.keys(State.metrics.catMap);
            let pData = pLabels.map(l => State.metrics.catMap[l].tersedia);
            const bgColors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#ec4899'];
            
            new Chart(ctxP, { 
                type: 'doughnut', 
                data: { labels: pLabels, datasets: [{data:pData, backgroundColor:bgColors.slice(0,pLabels.length), borderWidth:0}] }, 
                options: {responsive:true, maintainAspectRatio:false, cutout:'75%', plugins: {legend:{display:false}}} 
            });

            document.getElementById('pieChartLegend').innerHTML = pLabels.map((l, i) => `<div class="flex items-center gap-1.5"><div class="w-3 h-3 rounded-full shadow-sm" style="background-color: ${bgColors[i%bgColors.length]}"></div> ${l}</div>`).join('');
        }

        function openScanner(mode) {
            document.getElementById('scannerModal').classList.remove('hidden');
            document.getElementById('reader').dataset.mode = mode;
            
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, 
            (decodedText) => {
                html5QrCode.stop().then(() => {
                    closeScanner();
                    playBeep();
                    const text = String(decodedText).trim().toUpperCase();
                    let item = State.masterData.find(m => String(m.KodeBahan).toUpperCase() === text);
                    
                    if(item) {
                        if(document.getElementById('reader').dataset.mode === 'borrow') selectBahan(item);
                        else if(document.getElementById('reader').dataset.mode === 'selisih') selectBahanSelisih(item);
                    }
                    else Swal.fire('Tidak Ditemukan', `Barcode [${text}] tidak ada di Master Data`, 'warning');
                });
            }, (err) => {}).catch(err => { closeScanner(); Swal.fire('Error', 'Kamera tidak dapat diakses.', 'error'); });
        }
        function closeScanner() { document.getElementById('scannerModal').classList.add('hidden'); }
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        function toggleDropdown(mode) { const dd = document.getElementById(`listDrop_${mode}`); if(dd.classList.contains('hidden')) showDropdown(mode); else dd.classList.add('hidden'); }
        
        function filterDropdown(mode) {
            const isBorrow = mode === 'borrow';
            const inputId = isBorrow ? 'brwSearch' : 'inSlsSearch';
            const input = document.getElementById(inputId).value.toLowerCase();
            const list = document.getElementById(`listDrop_${mode}`);
            
            let optionsHtml = '';
            State.masterData.forEach((m, idx) => {
                let searchable = `${m.KodeBahan} ${m.NamaBahan} ${m.Merk} ${m.Ukuran}`.toLowerCase();
                if(searchable.includes(input)) {
                    let sedia = m.currentTersedia || 0;
                    let clsSedia = sedia > 0 ? 'text-emerald-600' : 'text-red-500';
                    let fnCall = isBorrow ? `selectBahan(State.masterData[${idx}])` : `selectBahanSelisih(State.masterData[${idx}])`;
                    
                    optionsHtml += `
                        <li onclick='${fnCall}' class="px-4 py-2 hover:bg-emerald-50 cursor-pointer border-b border-slate-50 flex justify-between items-center transition">
                            <div>
                                <div class="font-bold text-slate-800 text-sm">${m.NamaBahan}</div>
                                <div class="text-[10px] text-slate-500 font-mono">${m.KodeBahan} | ${m.Merk||'-'} | ${m.Ukuran||'-'}</div>
                            </div>
                            <div class="text-xs font-bold ${clsSedia} bg-slate-100 px-2 py-1 rounded">Sisa: ${sedia} ${m.Satuan||''}</div>
                        </li>
                    `;
                }
            });
            if(optionsHtml==='') optionsHtml = `<li class="px-4 py-3 text-xs text-center text-slate-400 italic">Pencarian tidak ditemukan.</li>`;
            list.innerHTML = optionsHtml;

        function loadBorrow(container) {
            container.appendChild(document.getElementById('tpl-borrow').content.cloneNode(true));
            
            const dateObj = new Date();
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const randomSuffix = Math.floor(1000 + Math.random() * 9000);
            document.getElementById('borrowAutoID').textContent = `TRX-${yyyy}${mm}${dd}-${randomSuffix}`;

            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('brwTglPinjam').value = now.toISOString().slice(0,16);
            document.getElementById('brwTglKembali').valueAsDate = new Date(new Date().setDate(new Date().getDate() + 3));

            document.getElementById('brwLokasi').innerHTML = State.locations.map(l => `<option value="${l}">${l}</option>`).join('');

            if(State.user.role === 'Peminjam') {
                const u = State.users.find(x => x.ID === State.user.id) || {};
                document.getElementById('brwNama').value = u.Nama || State.user.name;
                document.getElementById('brwNoPek').value = u.NoPek || '';
                document.getElementById('brwHP').value = u.NoHP || '';

        function addBorrowCart() {
            const kode = document.getElementById('brwSel_Kode').value;
            const qty = document.getElementById('brwSel_Qty').value;
            const max = parseFloat(document.getElementById('brwSel_Max').value||0);
            
            if(!kode) return Swal.fire('Info', 'Silakan pilih barang terlebih dahulu', 'info');
            if(!qty || parseFloat(qty) <= 0) return Swal.fire('Error', 'Jumlah harus lebih dari 0', 'error');
            if(parseFloat(qty) > max) return Swal.fire('Error', `Stock tersedia tidak cukup! (Maksimal ${max})`, 'error');

            const item = {
                kode: kode, 
                nama: document.getElementById('brwSel_Nama').value,
                merk: document.getElementById('brwSel_Merk').value,
                ukuran: document.getElementById('brwSel_Ukuran').value,
                warna: document.getElementById('brwSel_Warna').value,
                satuan: document.getElementById('brwSel_Satuan').value,
                qtyPinjam: parseFloat(qty),
                qtyKembali: 0,
                qtyRusak: 0,
                ket: document.getElementById('brwSel_Ket').value,
                status: 'Dipinjam'
            };

            const existIdx = State.borrowCart.findIndex(x => x.kode === kode);
            if(existIdx > -1) {
                if((State.borrowCart[existIdx].qtyPinjam + item.qtyPinjam) > max) {
                    return Swal.fire('Error', `Total item ini di keranjang melebihi stok tersedia (${max})`, 'error');
                }
                State.borrowCart[existIdx].qtyPinjam += item.qtyPinjam;
            } else {
                State.borrowCart.push(item);
            }

            document.getElementById('brwSearch').value=''; document.getElementById('brwSel_Kode').value='';
            document.getElementById('brwSel_Qty').value='1'; document.getElementById('brwSel_Ket').value='';
            document.getElementById('brwStockHint').classList.add('hidden');
            document.getElementById('brwLabelSatuan').textContent='';
            document.getElementById('btnBrwClearAsset').classList.add('hidden');

            renderBorrowCart();
        }

        function removeBorrowCart(idx) { State.borrowCart.splice(idx, 1); renderBorrowCart(); }

            const tbody = document.getElementById('borrowCartBody');
            const totalItem = document.getElementById('brwTotalItem');
            const btnSub = document.getElementById('btnSubmitBorrow');

            if(State.borrowCart.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-8 text-center text-slate-400 italic">Keranjang masih kosong. Silakan pilih barang di atas.</td></tr>`;
                totalItem.textContent = '0'; btnSub.disabled = true; return;
            }

            tbody.innerHTML = State.borrowCart.map((item, idx) => `
                <tr class="hover:bg-slate-50">
                    <td class="px-4 py-3 text-center text-slate-500 font-bold">${idx+1}</td>
                    <td class="px-4 py-3">
                        <div class="font-bold text-slate-800">${item.nama}</div>
                        <div class="text-[10px] text-slate-500 font-mono">${item.kode} | ${item.merk||'-'} | ${item.ukuran||'-'}</div>
                    </td>
                    <td class="px-4 py-3 text-center font-bold text-blue-600 text-lg">${item.qtyPinjam} <span class="text-xs font-normal text-slate-500">${item.satuan}</span></td>
                    <td class="px-4 py-3 text-xs italic text-slate-600">${item.ket || '-'}</td>
                    <td class="px-4 py-3 text-center">

        function submitBorrow() {
            const payload = {
                id: document.getElementById('borrowAutoID').textContent,
                tgl: document.getElementById('brwTglPinjam').value.replace('T', ' '),
                tenggat: document.getElementById('brwTglKembali').value,
                peminjam: document.getElementById('brwNama').value.trim(),
                noPek: document.getElementById('brwNoPek').value.trim(),
                noHP: document.getElementById('brwHP').value.trim(),
                lokasi: document.getElementById('brwLokasi').value.trim(),
                status: 'Dipinjam',
                items: State.borrowCart
            };

            if(!payload.peminjam || !payload.noPek || !payload.lokasi) return Swal.fire('Error', 'Lengkapi Nama, NoPek, dan Lokasi!', 'error');

            Swal.fire({
                title: 'Konfirmasi Peminjaman', text: `Mencatat ${payload.items.length} jenis aset untuk dipinjam oleh ${payload.peminjam}.`,
                icon: 'question', showCancelButton: true, confirmButtonText: 'Proses Peminjaman', confirmButtonColor: '#2563eb'
            }).then(r => {
                if(r.isConfirmed) {
                    Swal.fire({title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                    const gasPayload = {...payload, items: JSON.stringify(payload.items)};
                    
                    runGas('saveBorrow', gasPayload).then(d => {
                        syncLocalState(d);
                        
                        Swal.fire({
                            title: 'Peminjaman Berhasil', 
                            text: 'Data tercatat dan stok telah dikurangi. Bukti Peminjaman (Surat Jalan) akan dicetak secara otomatis.', 
                            icon: 'success',
                            timer: 3000,
                            timerProgressBar: true,
                            showConfirmButton: false
                        }).then(() => {
                            printPDF('borrow', payload);
                            navigate('riwayat_peminjaman');
                        });

                    }).catch(e => { Swal.fire('Error', 'Gagal memproses peminjaman', 'error'); });
                }
            });
        }

        function searchBorrowRecord() {
            const q = document.getElementById('retSearchQuery').value.toLowerCase().trim();
            if(!q) return Swal.fire('Info', 'Masukkan kata kunci pencarian (ID/Nama/NoPek)', 'info');

            const matches = State.trxBorrow.filter(trx => 
                trx.Status !== 'Selesai' && 
                (trx.ID.toLowerCase().includes(q) || trx.Peminjam.toLowerCase().includes(q) || String(trx.NoPek).toLowerCase().includes(q))
            );

            if(matches.length === 0) {
                document.getElementById('retResultArea').classList.add('hidden');
                return Swal.fire('Tidak Ditemukan', 'Tidak ada data peminjaman aktif yang cocok dengan kata kunci tersebut.', 'warning');
            }

            document.getElementById('retResultArea').classList.remove('hidden');
            
            if(matches.length === 1) {
                document.getElementById('retSelectionBox').classList.add('hidden');
                openReturnDetail(matches[0].ID);
            } else {
                document.getElementById('retSelectionBox').classList.remove('hidden');
                document.getElementById('retDetailBox').classList.add('hidden');
                document.getElementById('retSelectionBody').innerHTML = matches.map(trx => `
                    <tr class="hover:bg-slate-50 cursor-pointer" onclick="openReturnDetail('${trx.ID}')">
                        <td class="px-5 py-3 font-mono font-bold text-blue-600">${trx.ID}</td>
                        <td class="px-5 py-3">${trx.Tanggal}</td>
                        <td class="px-5 py-3"><b>${trx.Peminjam}</b><br><span class="text-xs text-slate-500">${trx.NoPek}</span></td>
                        <td class="px-5 py-3 text-center"><span class="bg-amber-100 text-amber-700 px-2 py-1 rounded text-xs font-bold">${trx.Status}</span></td>
                        <td class="px-5 py-3 text-center"><button class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-emerald-700">Pilih</button></td>
                    </tr>
                `).join('');
            }
        }

            document.getElementById('retDetailBox').classList.add('hidden');

        function validateReturnRow(idx, sisaMax) {
            let iBaik = document.getElementById(`retInpBaik_${idx}`);
            let iRusak = document.getElementById(`retInpRusak_${idx}`);
            let valB = parseFloat(iBaik.value)||0;
            let valR = parseFloat(iRusak.value)||0;

            if (valB < 0) { iBaik.value = 0; valB = 0; }
            if (valR < 0) { iRusak.value = 0; valR = 0; }

            if((valB + valR) > sisaMax) {
                Swal.fire('Input Tidak Valid', `Total pengembalian (Baik + Rusak/Hilang) tidak boleh melebihi sisa tanggungan (${sisaMax}).`, 'warning');
                iBaik.value = sisaMax; iRusak.value = 0; 
            }
        }

        function submitReturn() {
            if(!activeReturnTrx) return;
            let updatedItems = JSON.parse(JSON.stringify(activeReturnTrx.ItemsJSON)); 
            let logReturnItems = []; 
            let logSelisihItems = []; 
            let allValid = true;

            document.querySelectorAll('#retItemsBody tr').forEach(tr => {
                let idx = tr.dataset.idx;
                let vBaik = parseFloat(document.getElementById(`retInpBaik_${idx}`).value)||0;
                let vRusak = parseFloat(document.getElementById(`retInpRusak_${idx}`).value)||0;
                let vKet = document.getElementById(`retInpKet_${idx}`).value.trim();

                if(vRusak > 0 && vKet === '') {
                    Swal.fire('Keterangan Wajib', `Ada barang rusak/hilang (${updatedItems[idx].nama}). Keterangan wajib diisi!`, 'error');
                    allValid = false; return;
                }

                if(vBaik > 0 || vRusak > 0) {
                    updatedItems[idx].qtyKembali += vBaik;
                    updatedItems[idx].qtyRusak += vRusak;
                    
                    if(vBaik > 0) {
                        logReturnItems.push({
                            kode: updatedItems[idx].kode, nama: updatedItems[idx].nama, 
                            qty: vBaik, satuan: updatedItems[idx].satuan, kondisi: 'Baik'
                        });
                    }
                    if(vRusak > 0) {
                        logSelisihItems.push({
                            kode: updatedItems[idx].kode, nama: updatedItems[idx].nama, 
                            qty: vRusak, satuan: updatedItems[idx].satuan, kondisi: 'Rusak/Hilang', ket: vKet
                        });
                    }
                }
            });

            if(!allValid) return;
            if(logReturnItems.length === 0 && logSelisihItems.length === 0) return Swal.fire('Info', 'Tidak ada data (Qty > 0) yang diproses untuk dikembalikan.', 'info');

            let isAllDone = true;
            updatedItems.forEach(i => {
                let sisa = parseFloat(i.qtyPinjam) - parseFloat(i.qtyKembali) - parseFloat(i.qtyRusak);
                if(sisa > 0) isAllDone = false;
            });
            let newStatus = isAllDone ? 'Selesai' : 'Sebagian';

            const payload = {
                trxID: activeReturnTrx.ID,
                newStatus: newStatus,
                itemsJSON: JSON.stringify(updatedItems),
                tglReturn: document.getElementById('retTglReal').value.replace('T', ' '),
                petugas: State.user.name,
                logReturnJSON: JSON.stringify(logReturnItems),
                logSelisihJSON: JSON.stringify(logSelisihItems)
            };

            Swal.fire({title:'Konfirmasi', text:'Data pengembalian akan direkam secara permanen ke ledger.', icon:'question', showCancelButton:true, confirmButtonText:'Konfirmasi'}).then(r => {
                if(r.isConfirmed){
                    Swal.fire({title: 'Memproses...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                    runGas('saveReturn', payload).then(d => {
                        syncLocalState(d);
                        
                        Swal.fire({
                            title: 'Pengembalian Sukses', 
                            text: `Status Transaksi: ${newStatus}. Bukti Pengembalian akan dicetak secara otomatis.`, 
                            icon: 'success',
                            timer: 3000,
                            timerProgressBar: true,
                            showConfirmButton: false
                        }).then(() => {
                            printPDF('return', { idRef: activeReturnTrx.ID, tgl: payload.tglReturn, peminjam: activeReturnTrx.Peminjam, lokasi: activeReturnTrx.Lokasi, returnedB: logReturnItems, returnedR: logSelisihItems });
                            closeReturnDetail();
                            document.getElementById('retSearchQuery').value='';
                        });
                        
                    }).catch(e => Swal.fire('Error', 'Gagal menyimpan pengembalian', 'error'));
                }
            });
        }

                const q = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';

                State.filteredData = State.masterData.filter(m => {
                    let sMatch = `${m.KodeBahan} ${m.NamaBahan} ${m.Merk} ${m.Ukuran}`.toLowerCase().includes(q);

                    return sMatch && cMatch;

        function filterTrx() {
            const q = document.getElementById('trxSearch').value.toLowerCase().trim();
            const start = document.getElementById('trxStart').value;
            const end = document.getElementById('trxEnd').value;
            const stat = document.getElementById('trxStatus').value;

            State.trxFiltered = State.trxBorrow.filter(t => {
                let mQ = `${t.ID} ${t.Peminjam} ${t.NoPek} ${t.Lokasi}`.toLowerCase().includes(q) || t.ItemsJSON.some(i => i.nama.toLowerCase().includes(q) || i.kode.toLowerCase().includes(q));
                let mStat = stat ? t.Status === stat : true;
                let mDate = true;
                let tDate = t.Tanggal.split(' ')[0];
                if(start && tDate < start) mDate = false;
                if(end && tDate > end) mDate = false;
                
                let mRole = true;
                if(State.user.role === 'Peminjam') {
                    let u = State.users.find(x => x.Username === State.user.username) || {};
                    let myNoPek = u.NoPek ? String(u.NoPek).trim() : '';
                    let myName = State.user.name.toLowerCase().trim();
                    let trxPeminjam = String(t.Peminjam).toLowerCase().trim();
                    let trxNoPek = String(t.NoPek).trim();

                    if (myNoPek && trxNoPek === myNoPek) {
                        mRole = true;
                    } else if (trxPeminjam === myName) {
                        mRole = true;
                    } else {
                        mRole = false;
                    }
                }

                return mQ && mStat && mDate && mRole;
            }).sort((a,b) => new Date(b.Tanggal) - new Date(a.Tanggal));

            State.trxPage = 1; renderTrxBody();
        }

        function printPDF(type, data) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            const judul = type === 'borrow' ? "SURAT JALAN / BUKTI PEMINJAMAN ASET" : "BUKTI PENGEMBALIAN ASET";
